# =============================================================================
# GitHub Actions - Pipeline de Testes
# =============================================================================
# Esta pipeline executa os testes unitários e de integração do backend
# utilizando o docker-compose.yml do projeto para subir PostgreSQL e Redis.
#
# Trigger: Push ou Pull Request para as branches main e development
# =============================================================================

name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # =========================================================================
    # Variáveis de ambiente para os testes
    # =========================================================================
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/formulainfo
      REDIS_URL: redis://:redis_password@localhost:6379
      JWT_SECRET: test-jwt-secret-key-for-github-actions
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-for-github-actions

    # =========================================================================
    # Steps da pipeline
    # =========================================================================
    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Subir PostgreSQL e Redis via docker compose (aguarda healthcheck)
      - name: Start database and redis containers
        run: |
          docker compose up -d database redis --wait
          echo "Containers prontos!"

      # 3. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # 4. Instalar dependências e preparar banco
      - name: Install dependencies and setup database
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      # 5. Executar testes
      - name: Run tests
        working-directory: ./backend
        run: npm test

      # 6. Parar containers
      - name: Stop containers
        if: always()
        run: docker compose down -v
