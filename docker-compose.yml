version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: formula-info-db
    environment:
      POSTGRES_DB: formula_info
      POSTGRES_USER: formula_user
      POSTGRES_PASSWORD: formula_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - formula-network

  # Redis Cache (opcional, mas recomendado)
  redis:
    image: redis:7-alpine
    container_name: formula-info-redis
    ports:
      - "6379:6379"
    networks:
      - formula-network

  # Backend API (Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: formula-info-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://formula_user:formula_pass@postgres:5432/formula_info
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      OPENF1_API_URL: https://api.openf1.org/v1
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - formula-network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: formula-info-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - formula-network
    restart: unless-stopped

  # Nginx Proxy Reverso
  nginx:
    image: nginx:alpine
    container_name: formula-info-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - frontend
      - backend
    networks:
      - formula-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  formula-network:
    driver: bridge
